   the Ultra Admin, bulk GST exports - one menu entry, two tabs. #}

<nav class="subnav" aria-label="Filing and GST">
  <a href="{{ url_for('tenants.filing_tracker') }}" class="{{ 'active' if request.endpoint == 'tenants.filing_tracker' }}"

  <a href="{{ url_for('tenants.gst_exports') }}" class="{{ 'active' if request.endpoint == 'tenants.gst_exports' }}"

{% endif %}
