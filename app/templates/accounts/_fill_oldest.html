<p class="row gap-8 items-center">
  <button type="button" class="btn btn-secondary btn-sm" data-fill-oldest>Fill oldest bills first</button>
  <button type="button" class="btn btn-quiet btn-sm" data-clear-inputs=".alloc-input">Clear</button>
  <small class="text-muted">Whatever isn't set against a bill stays on account.</small>
</p>
<script nonce="{{ csp_nonce() }}">
  function fillOldestFirst() {
    var amountField = document.getElementById('voucher-amount');
    var left = amountField ? parseFloat(amountField.value || '0') : 0;
    if (amountField && amountField.dataset.unused) { left = parseFloat(amountField.dataset.unused); }
    document.querySelectorAll('.alloc-input').forEach(function (el) {
      var due = parseFloat(el.dataset.outstanding || '0');
      var take = Math.max(0, Math.min(due, left));
      el.value = take > 0 ? take.toFixed(2) : '';
      left = Math.round((left - take) * 100) / 100;
    });
  }
</script>
