name: Build the ARFA Android apps (Counter, Scan)

# This builds only the android/ project - it never touches the Flask
# app, and nothing in this workflow runs as part of (or can break) the
# website's own tests or deploys.
#
# Runs on GitHub's own runners, not locally: the sandbox this project
# was authored in has no route to dl.google.com (the Android SDK's
# package host), so this workflow is the only place the app actually
# compiles. android-actions/setup-android pins the exact SDK platform
# and build-tools this project needs rather than relying on whatever
# happens to be preinstalled on the runner image.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write # softprops/action-gh-release needs this to publish the release
  id-token: write # signing in to Google Cloud without a key (the arfa.live upload below)

# Where the apps are handed out from: arfa.live/apps (app/apps), out of this
# private bucket. GitHub signs in to Google Cloud as arfa-github, which may
# only write to that bucket - no key is stored here (Workload Identity
# Federation, made once by scripts/gcp/apps_setup.sh).
env:
  APPS_BUCKET: arfa-gst-prod-1-apps
  GCP_WORKLOAD_PROVIDER: projects/695809637488/locations/global/workloadIdentityPools/github/providers/github
  GCP_UPLOADER: arfa-github@arfa-gst-prod-1.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every build is signed with the same key, so it installs over the
      # last one. That is the shared key in android/app/ unless the repo has
      # its own in secrets (ANDROID_KEYSTORE_BASE64 = the .keystore file in
      # base64, plus ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
      # ANDROID_KEY_PASSWORD).
      - name: Use the repo's own signing key, if it has one
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arfa.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/arfa.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the APKs (ARFA Counter debug, ARFA Scan release - shrunk by R8)
        working-directory: android
        # Every published build gets a higher versionCode (the run number),
        # which the app's update check compares against.
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :scan:assembleRelease --no-daemon --stacktrace

      - name: Rename APK for a clear download name
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ARFA-Counter.apk
          # The old file name too, for links handed out before the rename.
          cp dist/ARFA-Counter.apk dist/ARFA-POS-debug.apk
          # What the app's update check reads (android/app/.../UpdateChecker.kt).
          # server_url: where the phones should talk to (android/server.json) -
          # a move of the server is a setting, not a reinstall.
          SERVER_URL=$(python3 -c 'import json; print(json.load(open("server.json")).get("server_url", ""))')
          # built_at and size: shown on arfa.live's Phone apps page.
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{"versionCode": %s, "versionName": "1.%s", "commit": "%s", "built_at": "%s", "size": %s, "apk": "https://github.com/%s/releases/download/android-latest/ARFA-Counter.apk", "server_url": "%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.sha }}" "$BUILT_AT" "$(stat -c %s dist/ARFA-Counter.apk)" "${{ github.repository }}" "$SERVER_URL" > dist/version.json
          # ARFA Scan - the bill-scanning app (android/scan) - and what its update check reads.
          cp scan/build/outputs/apk/release/scan-release.apk dist/ARFA-Scan.apk
          printf '{"versionCode": %s, "versionName": "1.%s", "commit": "%s", "built_at": "%s", "size": %s, "apk": "https://github.com/%s/releases/download/android-latest/ARFA-Scan.apk"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.sha }}" "$BUILT_AT" "$(stat -c %s dist/ARFA-Scan.apk)" "${{ github.repository }}" > dist/scan-version.json

      # Always available from this run's "Summary" page, even for a
      # push that isn't on the branch the release step publishes from.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARFA-Counter-apk
          path: android/dist/ARFA-Counter.apk
          retention-days: 90

      - name: Upload the ARFA Scan build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARFA-Scan-apk
          path: android/dist/ARFA-Scan.apk
          retention-days: 90

      # arfa.live/apps: the APKs first, then the version files that announce
      # them, so a phone is never told about an APK that isn't there yet.
      # Until scripts/gcp/apps_setup.sh has been run once this step can't
      # sign in; it is allowed to fail then, and the GitHub release below
      # still carries the build (which is where the apps look meanwhile).
      - name: Sign in to Google Cloud (no key)
        id: gcp
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_PROVIDER }}
          service_account: ${{ env.GCP_UPLOADER }}

      - name: Set up gcloud
        if: steps.gcp.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish to arfa.live (the apps bucket)
        if: steps.gcp.outcome == 'success'
        continue-on-error: true
        working-directory: android/dist
        run: |
          gcloud storage cp ARFA-Counter.apk ARFA-Scan.apk "gs://$APPS_BUCKET/latest/" \
            --content-type application/vnd.android.package-archive --cache-control "private, max-age=0"
          gcloud storage cp version.json scan-version.json "gs://$APPS_BUCKET/latest/" \
            --content-type application/json --cache-control "no-store"
          echo "Published to arfa.live/apps: build ${{ github.run_number }}"

      # A stable, permanent download link (unlike an Actions artifact,
      # which expires) - every successful build replaces the same
      # "android-latest" release's APK, so this one URL always has the
      # most recently built app.
      - name: Publish/update the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "ARFA Android apps - latest build (Counter, Scan)"
          body: |
            Auto-built from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            APK for direct installation (not a Play Store release).
            On the phone: enable "install from unknown sources" for your
            browser/file manager, download ARFA-Counter.apk, open it, install.
            Then ask the owner for a pairing code (Branches > Pair a phone).

            ARFA-Scan.apk is the bill-scanning app for owners and branches:
            install it the same way and sign in with your ARFA email and
            password.

            Points at: see android/README.md for the server URL this build
            talks to and how to change it.
          prerelease: true
          files: |
            android/dist/ARFA-Counter.apk
            android/dist/ARFA-POS-debug.apk
            android/dist/version.json
            android/dist/ARFA-Scan.apk
            android/dist/scan-version.json
