name: Build ARFA Counter Android APK

# This builds only the android/ project - it never touches the Flask
# app, and nothing in this workflow runs as part of (or can break) the
# website's own tests or deploys.
#
# Runs on GitHub's own runners, not locally: the sandbox this project
# was authored in has no route to dl.google.com (the Android SDK's
# package host), so this workflow is the only place the app actually
# compiles. android-actions/setup-android pins the exact SDK platform
# and build-tools this project needs rather than relying on whatever
# happens to be preinstalled on the runner image.
on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write # softprops/action-gh-release needs this to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every build is signed with the same key, so it installs over the
      # last one. That is the shared key in android/app/ unless the repo has
      # its own in secrets (ANDROID_KEYSTORE_BASE64 = the .keystore file in
      # base64, plus ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
      # ANDROID_KEY_PASSWORD).
      - name: Use the repo's own signing key, if it has one
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/arfa.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/arfa.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: android
        # Every published build gets a higher versionCode (the run number),
        # which the app's update check compares against.
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for a clear download name
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ARFA-Counter.apk
          # The old file name too, for links handed out before the rename.
          cp dist/ARFA-Counter.apk dist/ARFA-POS-debug.apk
          # What the app's update check reads (android/app/.../UpdateChecker.kt).
          # server_url: where the phones should talk to (android/server.json) -
          # a move of the server is a setting, not a reinstall.
          SERVER_URL=$(python3 -c 'import json; print(json.load(open("server.json")).get("server_url", ""))')
          printf '{"versionCode": %s, "versionName": "1.%s", "commit": "%s", "apk": "https://github.com/%s/releases/download/android-latest/ARFA-Counter.apk", "server_url": "%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.sha }}" "${{ github.repository }}" "$SERVER_URL" > dist/version.json

      # Always available from this run's "Summary" page, even for a
      # push that isn't on the branch the release step publishes from.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARFA-Counter-apk
          path: android/dist/ARFA-Counter.apk
          retention-days: 90

      # A stable, permanent download link (unlike an Actions artifact,
      # which expires) - every successful build replaces the same
      # "android-latest" release's APK, so this one URL always has the
      # most recently built app.
      - name: Publish/update the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "ARFA Counter (branch phone app) - latest build"
          body: |
            Auto-built from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            APK for direct installation (not a Play Store release).
            On the phone: enable "install from unknown sources" for your
            browser/file manager, download ARFA-Counter.apk, open it, install.
            Then ask the owner for a pairing code (Branches > Pair a phone).

            Points at: see android/README.md for the server URL this build
            talks to and how to change it.
          prerelease: true
          files: |
            android/dist/ARFA-Counter.apk
            android/dist/ARFA-POS-debug.apk
            android/dist/version.json
