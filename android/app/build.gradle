plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// An environment value, or the fallback when it's unset or empty (GitHub
// passes an empty string for a secret the repo doesn't have).
def envOr = { String name, String fallback ->
    def value = System.getenv(name)
    return (value == null || value.isEmpty()) ? fallback : value
}

android {
    namespace 'com.arfa.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.arfa.pos"
        // 26+ (Android 8.0, 2017+) rather than a lower floor: this lets
        // the launcher icon be a plain adaptive vector (below API 26,
        // adaptive icons need a separate set of raster PNG fallbacks
        // this project doesn't carry) and lets MainActivity use the
        // AndroidX SplashScreen API's real platform implementation
        // rather than its reduced compat shim. Android 7.x's remaining
        // install base is negligible for an internal operational tool.
        minSdk 26
        targetSdk 34
        // CI sets ANDROID_VERSION_CODE to the workflow's run number, so
        // every published build counts up and the in-app update check
        // (UpdateChecker) can tell a newer one; a local build is 1.
        def ciVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionCode ciVersionCode
        versionName "1.${ciVersionCode}"

        // The ARFA server a NEW install talks to. A phone already in use
        // keeps its own address (ServerAddress) and is moved by
        // android/server.json instead. No trailing slash.
        buildConfigField "String", "SERVER_BASE_URL", "\"https://arfa.live\""
        // Where the update check looks for the "android-latest" release.
        buildConfigField "String", "RELEASE_REPO", "\"abdulkadhersoofi-dot/pearl_city_biriyani\""
    }

    // One signing key for every build, so a new APK installs over the last
    // one (Android refuses an update signed with a different key - and a
    // fresh GitHub runner would otherwise make a new debug key each time,
    // forcing an uninstall that loses bills waiting on the phone). The
    // shared debug key lives next to this file; a shop that wants its own
    // sets the ANDROID_KEYSTORE_* secrets (.github/workflows/android-apk.yml).
    signingConfigs {
        shared {
            storeFile file(envOr("ANDROID_KEYSTORE_FILE", "arfa-counter-debug.keystore"))
            storePassword envOr("ANDROID_KEYSTORE_PASSWORD", "android")
            keyAlias envOr("ANDROID_KEY_ALIAS", "arfacounter")
            keyPassword envOr("ANDROID_KEY_PASSWORD", "android")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.shared
            // Built and distributed via GitHub Actions (see
            // .github/workflows/android-apk.yml) as a debug-signed APK,
            // meant for direct sideloading - not a Play Store release,
            // so there is no separate release keystore to manage here.
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
}
