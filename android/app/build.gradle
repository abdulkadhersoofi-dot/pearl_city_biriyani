plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.arfa.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.arfa.pos"
        // 26+ (Android 8.0, 2017+) rather than a lower floor: this lets
        // the launcher icon be a plain adaptive vector (below API 26,
        // adaptive icons need a separate set of raster PNG fallbacks
        // this project doesn't carry) and lets MainActivity use the
        // AndroidX SplashScreen API's real platform implementation
        // rather than its reduced compat shim. Android 7.x's remaining
        // install base is negligible for an internal operational tool.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // The ARFA server this app talks to. Change this one line (and
        // bump versionCode/versionName below) to point a rebuild at a
        // different server - e.g. once a real domain replaces this
        // Render.com URL. No trailing slash.
        buildConfigField "String", "SERVER_BASE_URL", "\"https://gst-billing-app-prdx.onrender.com\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Built and distributed via GitHub Actions (see
            // .github/workflows/android-apk.yml) as a debug-signed APK,
            // meant for direct sideloading - not a Play Store release,
            // so there is no separate release keystore to manage here.
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
}
