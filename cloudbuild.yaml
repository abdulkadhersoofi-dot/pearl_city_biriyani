# Every push to the deploy branch (the Cloud Build trigger "arfa-push",
# made by scripts/gcp/setup.sh trigger): build the image, release it to
# staging, then to production, then publish the Firebase Hosting config.
# A failed step stops the rest; the version already serving keeps serving.
# Settings: deploy/gcp/settings.env. Run by hand: scripts/gcp/deploy.sh.
substitutions:
  _REGION: asia-south1
  _REPO: arfa
  _VERSION: manual
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  machineType: E2_HIGHCPU_8
timeout: 3600s
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID"]
  - id: staging
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ["PROJECT_ID=$PROJECT_ID"]
    args: ["scripts/gcp/release.sh", "staging", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID", "${SHORT_SHA:-${_VERSION}}"]
  - id: production
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    env: ["PROJECT_ID=$PROJECT_ID"]
    args: ["scripts/gcp/release.sh", "production", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID", "${SHORT_SHA:-${_VERSION}}"]
  - id: hosting
    name: node:20-bookworm-slim
    entrypoint: bash
    env: ["PROJECT_ID=$PROJECT_ID"]
    args: ["scripts/gcp/hosting.sh"]
