# Builds and stores an image without deploying it (scripts/gcp/setup.sh image).
substitutions:
  _REGION: asia-south1
  _REPO: arfa
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID", "."]
images: ["${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID"]
