# Example Nginx site config for the GST billing app, fronting Gunicorn on
# 127.0.0.1:8000. Copy to /etc/nginx/sites-available/gst-billing, adjust
# server_name and TLS cert paths, then symlink into sites-enabled.

upstream gst_billing_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name billing.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name billing.example.com;

    ssl_certificate     /etc/letsencrypt/live/billing.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.example.com/privkey.pem;

    client_max_body_size 10m;

    location /static/ {
        alias /opt/gst-billing/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://gst_billing_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
