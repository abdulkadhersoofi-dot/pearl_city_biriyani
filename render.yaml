# Render Blueprint - one-click provisioning of the web app + Postgres +
# Redis together. In the Render dashboard: New -> Blueprint -> point at
# this repo. Review the plans it proposes (free tiers may not always be
# offered) before clicking Apply.
#
# The free plan has no Shell tab, so the firm's first Super Admin login
# is created automatically at container startup instead, from the
# SUPER_ADMIN_EMAIL / SUPER_ADMIN_PASSWORD env vars below (set their real
# values in the Render dashboard - Environment tab on the web service -
# they're deliberately left blank here). Saving them triggers a redeploy;
# after that, sign in with whatever you set.

databases:
  - name: gst-billing-db
    plan: free
    # postgresMajorVersion omitted deliberately - Render defaults to its
    # current supported version, and this field has a history of type-
    # validation quirks (string vs number) across schema versions.

services:
  - type: keyvalue
    name: gst-billing-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # only reachable from other services in this project

  - type: web
    name: gst-billing-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    # preDeployCommand (run once before rollout) is a paid-tier-only
    # feature - not available on free. Migrations instead run at
    # container startup via deploy/entrypoint.sh (flask db upgrade is
    # idempotent, so this is safe on every restart).
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gst-billing-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gst-billing-redis
          type: keyvalue
          property: connectionString
      - key: FIRM_NAME
        value: Pearl City & Associates
      - key: SUPER_ADMIN_NAME
        value: Firm Admin
      - key: SUPER_ADMIN_EMAIL
        sync: false # set your real login email in the dashboard
      - key: SUPER_ADMIN_PASSWORD
        sync: false # set your real login password in the dashboard
      - key: GUNICORN_WORKERS
        value: "2" # free-tier instances are RAM/CPU constrained; raise
        # this (Settings -> Environment) once you upgrade the plan.
